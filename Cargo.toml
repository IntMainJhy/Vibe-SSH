[workspace]
members = ["crates/protocol", "crates/core", "crates/cli", "apps/desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.89"
publish = false
license-file = "LICENSE"
repository = "https://github.com/IntMainJhy/Vibe-SSH"
homepage = "https://github.com/IntMainJhy/Vibe-SSH"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.10"
russh-sftp = "=3.0.1"
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "process", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }
vibe-ssh-protocol = { path = "crates/protocol" }
vibe-ssh-core = { path = "crates/core" }
vibe-ssh-cli = { path = "crates/cli" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = true
