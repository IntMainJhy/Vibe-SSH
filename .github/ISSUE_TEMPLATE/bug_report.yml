name: Bug report / 问题反馈
description: Report a reproducible problem with Vibe-SSH / 提供可复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        English and Chinese are welcome. Remove passwords, private keys, tokens and sensitive server details.
        安全漏洞请使用 Security 页的私密报告入口，不要公开利用步骤或凭据。
  - type: input
    id: version
    attributes:
      label: Vibe-SSH version / 版本
      placeholder: "0.2.0-preview.4 or a commit SHA"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version and architecture / 系统与芯片
      placeholder: "macOS version, Apple silicon (arm64) or Intel (x86_64)"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 相关功能
      options:
        - Installation or update / 安装与升级
        - Host configuration or connection / 主机配置与连接
        - Terminal / 终端
        - Files or text editing / 文件与文本编辑
        - Agent integration or takeover / Agent 接入与接管
        - Monitoring / 监控
        - Documentation / 文档
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include the minimum sequence and remote OS/SSH server version when relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots / 已脱敏日志或截图
      description: Distinguish native app, browser sample preview, or actual SSH server evidence.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I removed credentials and sensitive server information. / 我已移除凭据与敏感服务器信息。
          required: true
