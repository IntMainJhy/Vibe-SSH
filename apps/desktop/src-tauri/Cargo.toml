[package]
name = "vibe-ssh-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
description = "macOS SSH and SFTP desktop client for people and external AI agents"

[features]
# Developer-only: requires a disposable scripts/native-acceptance.py fixture.
native-acceptance = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
tokio.workspace = true
security-framework = "3"
serde_json.workspace = true
tauri = { version = "2", features = [] }
uuid.workspace = true
vibe-ssh-cli.workspace = true
vibe-ssh-core.workspace = true
vibe-ssh-protocol.workspace = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile.workspace = true

[lints]
workspace = true
